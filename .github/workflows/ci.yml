name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows: PowerShell writer and tray
          - os: windows-latest
            python-version: "3.12"

          # Linux: Python writer and tray
          - os: ubuntu-latest
            python-version: "3.12"

          # macOS: Python writer and SwiftBar plugin
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11bd71901edd7d16190fc6369f1a12a3c1ff069b  # v4

      # Python setup (all platforms)
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b470db3fb942d3ce0d  # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ruff lint (Python code quality)
      - name: Lint with ruff
        run: |
          python -m pip install ruff --quiet
          ruff check writer/*.py tray/*.py tests/*.py 2>/dev/null || true
          ruff format --check writer/*.py tray/*.py tests/*.py 2>/dev/null || true
        if: runner.os == 'Linux' || runner.os == 'macOS'
        continue-on-error: true

      # No-network guard: fail if sources contain network-related keywords
      - name: Security: no-network guard
        run: |
          python -m pip install ruff --quiet
          if grep -rE 'Invoke-WebRequest|Invoke-RestMethod|Net\.WebClient|HttpClient|urllib|requests|socket|http\.client|curl|wget|URLSession|\.credentials|oauth|Keychain|security find-' writer/ tray/ --include="*.py" --include="*.ps1" --include="*.sh" 2>/dev/null | grep -v '#.*allow-network'; then
            echo "ERROR: Found network-related code. This project must not make HTTP calls or read credentials."
            exit 1
          fi
        continue-on-error: true

      # Python tests
      - name: Run pytest
        run: |
          python -m pip install pytest --quiet
          pytest tests/ -v 2>/dev/null || echo "No tests found yet (expected during scaffold)"
        if: runner.os != 'Windows'
        continue-on-error: true

      # PowerShell tests (Windows only)
      - name: Run Pester tests
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Quiet -ErrorAction SilentlyContinue
          Invoke-Pester -Path tests/ -Output Detailed 2>$null || Write-Output "No Pester tests found yet (expected during scaffold)"
        if: runner.os == 'Windows'
        continue-on-error: true

      # Shell lint (Linux / macOS)
      - name: Lint shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck writer/*.sh tray/*.sh install/*.sh 2>/dev/null || true
          fi
        if: runner.os == 'Linux' || runner.os == 'macOS'
        continue-on-error: true

  # Verify version stamps match (post-scaffold, when files exist)
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901edd7d16190fc6369f1a12a3c1ff069b  # v4
      - name: Check version stamps
        run: |
          # This job will be enabled once scripts are added
          echo "Version check: deferred until milestone M1"
        continue-on-error: true
