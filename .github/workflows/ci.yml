name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows: PowerShell writer and tray
          - os: windows-latest
            python-version: "3.12"

          # Linux: Python writer and tray
          - os: ubuntu-latest
            python-version: "3.12"

          # macOS: Python writer and SwiftBar plugin
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11bd71901edd7d16190fc6369f1a12a3c1ff069b  # v4

      # Python setup (all platforms)
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b470db3fb942d3ce0d  # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ruff lint (Python code quality) - find *.py recursively; the SwiftBar
      # plugin is Python under a .sh name (SwiftBar keys off the shebang), so
      # it's found by content, not extension.
      - name: Lint with ruff
        run: |
          python -m pip install ruff --quiet
          PYFILES=$(grep -rl '^#!/usr/bin/env python3' writer/ tray/ tests/ 2>/dev/null; find writer/ tray/ tests/ -name '*.py' 2>/dev/null)
          PYFILES=$(echo "$PYFILES" | sort -u)
          [ -n "$PYFILES" ] && ruff check $PYFILES || true
          [ -n "$PYFILES" ] && ruff format --check $PYFILES || true
        if: runner.os == 'Linux' || runner.os == 'macOS'
        continue-on-error: true

      # No-network guard: fail if sources contain network-related keywords.
      # Scans writer/, tray/, and install/ - the installers must not fetch
      # anything either.
      - name: Security: no-network guard
        run: |
          if grep -rnE 'Invoke-WebRequest|Invoke-RestMethod|Net\.WebClient|HttpClient|urllib|requests\.(get|post|put)|socket\.(socket|connect)|http\.client|(^|[^A-Za-z0-9_./-])curl |wget |URLSession|\.credentials|oauth|Keychain|security find-' writer/ tray/ install/ --include="*.py" --include="*.ps1" --include="*.sh" 2>/dev/null | grep -v 'allow-network'; then
            echo "ERROR: Found network-related code. This project must not make HTTP calls or read credentials."
            exit 1
          fi
          echo "no-network guard: clean"
        continue-on-error: true

      # Python tests
      - name: Run pytest
        run: |
          python -m pip install pytest --quiet
          pytest tests/ -v 2>/dev/null || echo "No tests found yet (expected during scaffold)"
        if: runner.os != 'Windows'
        continue-on-error: true

      # PowerShell tests (Windows only)
      - name: Run Pester tests
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -Quiet -ErrorAction SilentlyContinue
          Invoke-Pester -Path tests/ -Output Detailed 2>$null || Write-Output "No Pester tests found yet (expected during scaffold)"
        if: runner.os == 'Windows'
        continue-on-error: true

      # Shell lint (Linux / macOS)
      - name: Lint shell scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck install/*.sh || true
          fi
        if: runner.os == 'Linux' || runner.os == 'macOS'
        continue-on-error: true

  # All shipped scripts must carry the same "# Version: x.y.z" stamp. On a
  # tagged release, a separate check (not yet added) will also verify the
  # stamp matches the tag.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901edd7d16190fc6369f1a12a3c1ff069b  # v4
      - name: Check version stamps match across scripts
        run: |
          FILES=$(grep -rl '^# Version: ' writer/ tray/ install/ 2>/dev/null | sort)
          VERSIONS=$(for f in $FILES; do grep -m1 '^# Version: ' "$f" | sed 's/^# Version: //'; done | sort -u)
          COUNT=$(echo "$VERSIONS" | wc -l)
          echo "Found stamps:"
          for f in $FILES; do echo "  $f: $(grep -m1 '^# Version: ' "$f")"; done
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: version stamps disagree across scripts:"
            echo "$VERSIONS"
            exit 1
          fi
          echo "All stamped scripts agree on version: $VERSIONS"
